<div class="login-page">
  <div class="login-overlay"></div>

  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="login-header">
      <h1>Veterinaria X</h1>
      <p>Iniciar sesión en el sistema</p>
    </div>

    <div class="form-group">
      <label>Correo</label>

      <input
        type="email"
        formControlName="correo"
        placeholder="Ingrese su correo"
        autocomplete="email"
      />

      @if (form.get('correo')?.invalid && form.get('correo')?.touched) {
        <small class="field-error">Ingrese un correo válido.</small>
      }
    </div>

    <div class="form-group">
      <label>Contraseña</label>

      <div class="password-wrapper">
        <input
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          placeholder="Ingrese su contraseña"
          autocomplete="current-password"
        />

        <button
          type="button"
          class="password-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [title]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          @if (passwordVisible) {
            <span class="eye-icon">👁️</span>
          } @else {
            <span class="eye-icon">🙈</span>
          }
        </button>
      </div>

      @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <small class="field-error">La contraseña es obligatoria.</small>
      }
    </div>

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <button class="login-submit" type="submit" [disabled]="loading">
      {{ loading ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
